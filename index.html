<style>

<script>


const rules = [{"keywords":["pengertian eksponen"],"question":"apa pengertian eksponen?","category":"Konsep","response":"bentuk perpangkatan dalam matematika yang menunjukkan perkalian berulang suatu bilangan dengan bilangan itu sendiri.","image":null},{"keywords":["rumus pangkat perkalian"],"question":"apa rumus pangkat perkalian?","category":"Rumus","response":"\\(a^m \\times a^n = a^{m+n}\\)","image":null},{"keywords":["contoh soal eksponen"],"question":"berikan contoh soal  eksponen","category":"Contoh","response":"2³ × 2² = 2³⁺² = 2⁵ = 32","image":null},{"keywords":["latihan soal eksponen"],"question":"berikan latihan soal eksponen","category":"Latihan","response":"Sederhanakan bentuk dari \\[\\frac{x^{5}\\cdot x^{3}}{x^{4}}\\]!Pembahasan:Gunakan sifat perkalian pangkat (pangkat dijumlahkan) untuk pembilang, lalu sifat pembagian pangkat (pangkat dikurangkan).\\[\\frac{x^{5}\\cdot x^{3}}{x^{4}}=\\frac{x^{5+3}}{x^{4}}=\\frac{x^{8}}{x^{4}}=x^{8-4}=\\mathbf{x}^{\\mathbf{4}}\\]","image":null},{"keywords":["kesalahan umum"],"question":"kesalahan umum yang sering terjadi","category":"Kesalahan Umum","response":"Menjumlahkan atau Mengurangi Bilangan Pokok (Basis)Salah: \\(2^3 \\times 2^2 = 4^5\\)Benar: \\(2^3 \\times 2^2 = 2^{3+2} = 2^5\\)Penjelasan: Saat mengalikan eksponen dengan basis yang sama, hanya pangkatnya yang dijumlahkan, sedangkan bilangan basisnya tetap.","image":null},{"keywords":["sifat eksponen"],"question":"jelaskan sifat sifat eksponen!","category":"Rumus","response":"sifat perkalian pangkat:\nJika dua bilangan berpangkat dengan basis yang sama dikalikan, maka pangkatnya cukup dijumlahkan. Rumus:\\[a^{m}\\times a^{n}=a^{m+n}\\]Contoh: \\[3^{2}\\times 3^{4}=3^{2+4}=3^{6}=729\\]\nsifat pembagian pangkat:\nJika dua bilangan berpangkat dengan basis yang sama dibagi, maka pangkatnya cukup dikurangkan (pangkat pembilang dikurangi pangkat penyebut). Rumus:\\[\\frac{a^{m}}{a^{n}}=a^{m-n}\\quad (a\\ne 0)\\]Contoh: \\[\\frac{5^{7}}{5^{4}}=5^{7-4}=5^{3}=125\\]\nsifat pangkat dipangkatkan:\nJika suatu bilangan berpangkat dipangkatkan lagi dengan bilangan lain, maka kedua pangkat tersebut harus dikalikan. Rumus:\\[(a^{m})^{n}=a^{m\\times n}\\]Contoh: \\[(2^{3})^{2}=2^{3\\times 2}=2^{6}=64\\]\nsifat pangkat pecahan:\nPangkat pecahan merupakan cara lain untuk menuliskan bentuk akar. Pembilang menjadi pangkat dari bilangan di dalam akar, sedangkan penyebut menjadi nilai akarnya. Rumus:\\[a^{\\frac{m}{n}}=\\sqrt[n]{a^{m}}\\]Contoh: \\[8^{\\frac{2}{3}}=\\sqrt[3]{8^{2}}=\\sqrt[3]{64}=4\\quad (\\text{karena\\ }4\\times 4\\times 4=64)\\]\nsifat pangkat negatif:\nPangkat negatif digunakan untuk menunjukkan kebalikan (per) dari bilangan pangkat positifnya. Sifat ini mengubah posisi bilangan menjadi pecahan. Rumus:\\[a^{-n}=\\frac{1}{a^{n}}\\quad (a\\ne 0)\\]Contoh: \\[2^{-3}=\\frac{1}{2^{3}}=\\frac{1}{8}\\]\nsifat pangkat 0:\nSetiap bilangan real yang bukan nol, jika dipangkatkan dengan nol, hasilnya akan selalu sama dengan 1. Rumus:\\[a^{0}=1\\quad (a\\ne 0)\\]Contoh: \\[5^{0}=1\\quad \\text{atau}\\quad 999^{0}=1\\]","image":null}];


function normalizeText(text) {

    return text

        .toLowerCase()

        .trim()

        .replace(/\s+/g, " ");

}


function findResponse(input) {

    const normalized =
        normalizeText(input);


    let bestRule = null;

    let bestScore = 0;


    rules.forEach(rule => {

        let score = 0;


        rule.keywords.forEach(keyword => {

            const key =
                normalizeText(keyword);


            if (
                normalized.includes(key)
            ) {

                score += key.length;

            }

        });


        if (score > bestScore) {

            bestScore = score;

            bestRule = rule;

        }

    });


    if (bestRule) {

        return bestRule;

    }


    return {

        response:
            "Maaf, saya belum memahami pertanyaan tersebut. Coba gunakan kata kunci lain atau tanyakan dengan cara berbeda.",

        image: null

    };

}


function addMessage(
    type,
    text,
    image
) {

    const chatbox =
        document.getElementById("chatbox");

    const chat =
        document.createElement("div");

    chat.className =
        "chat " + type;

    if (type === "incoming") {

        chat.innerHTML = `
            <div class="bot-icon">
                <i class='bx bx-bot'></i>
            </div>

            <div class="message"></div>
        `;

    } else {

        chat.innerHTML = `
            <div class="message"></div>
        `;

    }

    const message =
        chat.querySelector(".message");

    if (text) {

        const paragraph =
            document.createElement("p");

        paragraph.textContent =
            text;

        message.appendChild(paragraph);

    }

    if (image && image.dataUrl) {

        const imageElement =
            document.createElement("img");

        imageElement.src =
            image.dataUrl;

        imageElement.alt =
            image.name || "Gambar respons chatbot";

        imageElement.loading =
            "lazy";

        message.appendChild(imageElement);

    }

    chatbox.appendChild(chat);

    chatbox.scrollTop =
        chatbox.scrollHeight;

    if (
        window.MathJax &&
        MathJax.typesetPromise
    ) {

        MathJax.typesetPromise([
            chat
        ]);

    }

}



function sendMessage() {

    const input =
        document.getElementById("input");


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    addMessage(
        "outgoing",
        text
    );


    input.value = "";


    setTimeout(() => {

        const response =
            findResponse(text);


        addMessage(
            "incoming",
            response.response || "",
            response.image || null
        );

    }, 350);

}


document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


</script>
